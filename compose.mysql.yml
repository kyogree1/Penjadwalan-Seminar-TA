services:
    mysql:
        image: mysql:8.0
        container_name: enrolify-mysql
        restart: unless-stopped
        ports:
            - '127.0.0.1:3307:3306'
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
            MYSQL_DATABASE: seminar_ta
        volumes:
            - enrolify_mysql_data:/var/lib/mysql
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-enrolify.sql:ro
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 20s
volumes:
    enrolify_mysql_data:
